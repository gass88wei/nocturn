<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nocturn — 实时态势与任务工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg-app: #f6f7f9;
      --bg-main: #ffffff;
      --bg-sidebar: #f6f7f9;
      --bg-hover: #eef0f4;
      --bg-now-active: #dfe6ff;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --border-subtle: #ebedf0;
      --border-card: #e5e7eb;
      --blue-line: #2563eb;
      --purple-line: #7c3aed;
      --gray-line: #64748b;
      --green-online: #22c55e;

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Inter", sans-serif;
      color: var(--text-primary);
      background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
    }

    .workspace-frame {
      display: grid;
      grid-template-columns: 44px 204px minmax(0, 1fr);
      height: 100vh;
      background: var(--bg-app);
    }
    .workspace-frame.sidebar-collapsed {
      grid-template-columns: 44px 0px minmax(0, 1fr);
    }
    .workspace-frame.sidebar-collapsed .contacts-pane {
      overflow: hidden;
      padding: 0;
      border-right: none;
    }

    /* 1. 极简左窄栏 */
    .rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 10px;
      border-right: 1px solid var(--border-subtle);
      background: var(--bg-sidebar);
      user-select: none;
    }
    .rail-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #1e1b4b;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      position: relative;
      cursor: pointer;
    }
    .rail-logo::after {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      border: 1.5px solid var(--bg-sidebar);
    }
    .rail-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #646a73;
      cursor: pointer;
    }
    .rail-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
    .rail-icon.active { background: #e0e7ff; color: #4f46e5; }
    .rail-spacer { flex: 1; }

    /* 2. 二级侧边栏 */
    .contacts-pane {
      background: var(--bg-sidebar);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid var(--border-subtle);
      user-select: none;
      overflow-y: auto;
    }
    .contacts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 4px;
    }
    .contacts-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .collapse-btn {
      color: #8f959e;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
    }
    .collapse-btn:hover { background: var(--bg-hover); }

    .primary-nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      color: #374151;
      transition: all 0.12s;
    }
    .primary-nav-btn:hover { background: #e8ebf0; }
    .primary-nav-btn.active {
      background: var(--bg-now-active);
      color: #1e1b4b;
    }
    .primary-nav-left { display: flex; align-items: center; gap: 8px; }
    .primary-nav-count {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(79, 70, 229, 0.12);
      color: #4f46e5;
    }

    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: #8f959e;
      padding: 8px 4px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list { display: flex; flex-direction: column; gap: 2px; }
    .nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .nav-row:hover { background: #e8ebf0; }
    .nav-row.active {
      background: #dfe6ff;
      border-color: #c7d2fe;
    }
    .member-avatar-wrap { position: relative; width: 26px; height: 26px; flex-shrink: 0; }
    .member-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 9.5px; color: #fff;
    }
    .online-dot {
      position: absolute; right: -1px; bottom: -1px;
      width: 7.5px; height: 7.5px; border-radius: 50%;
      background: var(--green-online); border: 1.5px solid var(--bg-sidebar);
    }
    .nav-meta { min-width: 0; flex: 1; }
    .nav-name {
      font-size: 12px; font-weight: 600; color: #1f2329;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 4px;
    }
    .nav-desc {
      font-size: 10px; color: #8f959e;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .role-badge {
      display: inline-flex; align-items: center;
      font-size: 9px; font-weight: 600; color: #646a73;
      background: #e5e7eb; border-radius: 4px; padding: 0 4px;
    }
    .role-badge.leader { color: #4f46e5; background: #e0e7ff; }
    .role-badge.worker { color: #1d4ed8; background: #dbeafe; }

    /* 3. 主面板区域 */
    .main-surface {
      background: var(--bg-main);
      margin: 6px 6px 6px 0;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      display: flex;
      min-width: 0;
      height: calc(100vh - 12px);
      overflow: hidden;
    }

    .center-stage-pane {
      flex: 1;
      min-width: 0;
      padding: 14px 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 顶部派单输入栏 */
    .dispatch-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f7ff;
      border: 1px solid #c7d2fe;
      border-radius: 11px;
      padding: 7px 11px;
    }
    .dispatch-bar input {
      flex: 1;
      height: 30px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 0 10px;
      font-size: 12px;
      background: #fff;
      color: #1f2329;
      outline: none;
    }
    .dispatch-bar input:focus { border-color: #4f46e5; }

    .now-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stats-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stats-left { display: flex; align-items: flex-end; gap: 22px; }
    .stat-block .stat-num {
      font-size: 28px; font-weight: 600; line-height: 1;
      color: #1f2329; font-variant-numeric: tabular-nums;
    }
    .stat-block .stat-caption { font-size: 11px; color: #646a73; margin-top: 3px; }

    .legend-bar {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 12px; font-size: 11px; color: #646a73;
    }
    .legend-tag { display: inline-flex; align-items: center; gap: 5px; }

    .bipartite-stage {
      position: relative;
      display: grid;
      grid-template-columns: 194px minmax(70px, 15%) minmax(190px, 1fr);
      min-height: 360px;
      align-items: start;
    }
    .left-column {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }

    .squad-pod {
      background: #f8f9fb;
      border: 1px solid #e5e7eb;
      border-radius: 11px;
      padding: 6px 8px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .squad-pod.focused-pod { border-color: #6366f1; background: #f5f7ff; }
    .squad-pod.dimmed-pod { opacity: 0.4; }
    .squad-pod-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 2px 4px; border-bottom: 1px dashed #e2e5ec;
      cursor: pointer;
    }
    .squad-pod-name {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10.5px; font-weight: 700; color: #374151;
    }
    .squad-pod-dot { width: 6px; height: 6px; border-radius: 2px; }
    .squad-pod-tag { font-size: 9px; color: #646a73; background: #eef0f4; padding: 1px 5px; border-radius: 99px; }

    .actor-node {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 4px; border-radius: 7px; cursor: pointer;
      border: 1px solid transparent;
    }
    .actor-node:hover { background: #eef0f4; }
    .actor-node.selected-actor { background: #e0e7ff; border-color: #818cf8; }
    .actor-node.dimmed-actor { opacity: 0.38; }
    .actor-node.worker-indent { padding-left: 9px; position: relative; }
    .actor-node.worker-indent::before {
      content: ""; position: absolute; left: 3px; top: -3px; bottom: 50%;
      width: 4px; border-left: 1.5px solid #d1d5db; border-bottom: 1.5px solid #d1d5db;
    }
    .actor-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .actor-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .actor-name { font-size: 11.5px; font-weight: 600; color: #1f2329; white-space: nowrap; }
    .actor-sub { font-size: 9.5px; color: #8f959e; white-space: nowrap; }
    .origin-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--purple-line); flex-shrink: 0;
    }
    .origin-dot.blue { background: var(--blue-line); }

    .right-column {
      grid-column: 3; display: flex; flex-direction: column;
      gap: 7px; z-index: 2; min-width: 0; padding-top: 2px;
    }
    .task-pill {
      height: 32px; background: #fff; border: 1px solid #e2e5ec;
      border-radius: 8px; padding: 0 10px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; cursor: pointer;
    }
    .task-pill.selected-pill {
      border-color: #4f46e5;
      background: #f5f7ff;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.14);
    }
    .task-pill.dimmed-pill { opacity: 0.35; }
    .task-pill:hover { border-color: #6366f1; }
    .task-pill-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .task-dot { width: 6.5px; height: 6.5px; border-radius: 50%; flex-shrink: 0; }
    .task-dot.running { background: var(--blue-line); }
    .task-dot.dispatching { background: var(--purple-line); }
    .task-dot.in_review { background: #10b981; }
    .task-title { font-size: 11.5px; color: #1f2329; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .verdict-mini-badge {
      font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .verdict-mini-badge.progress { background: #dbeafe; color: #1d4ed8; }
    .verdict-mini-badge.ready { background: #d1fae5; color: #047857; }
    .verdict-mini-badge.dispatch { background: #ede9fe; color: #6d28d9; }

    .issue-bind-chip {
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px dashed #94a3b8;
      color: #475569;
      background: #f8fafc;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .issue-bind-chip:hover {
      border-color: #4f46e5;
      color: #4f46e5;
      background: #eef2ff;
    }
    .issue-bind-chip.bound {
      border-style: solid;
      border-color: #c7d2fe;
      background: #eef2ff;
      color: #4338ca;
    }

    .curves-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    /* ============================================================================
       新增：📋 任务列表 (Issues) 视图（解决看不到 Issue 列表的问题）
       ============================================================================ */
    .issues-board-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .issues-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f1f4;
      background: #fafbfc;
    }
    .filter-tabs { display: flex; gap: 6px; }
    .filter-tab {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: #646a73;
      border: 1px solid transparent;
    }
    .filter-tab:hover { background: #eef0f4; }
    .filter-tab.active {
      background: #1e1b4b;
      color: #fff;
    }
    .issue-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
      transition: background 0.1s;
    }
    .issue-row:hover { background: #f8fafc; }
    .issue-row.selected { background: #f5f7ff; }
    .issue-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .issue-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      color: #4f46e5;
      background: #eef2ff;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .issue-row-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .issue-row-summary {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .issue-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .del-btn {
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .del-btn:hover { background: #fee2e2; color: #dc2626; }

    /* ============================================================================
       4. 右侧紧凑型 Session 抽屉（彻底瘦身：宽度 355px，单行截断步骤，最大高度限流）
       ============================================================================ */
    .issue-peek-panel {
      width: 355px;
      border-left: 1px solid #e5e7eb;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }
    .peek-header {
      padding: 9px 12px;
      border-bottom: 1px solid #ebedf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .peek-mode-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #dbeafe;
      color: #1d4ed8;
    }
    .peek-props-bar {
      padding: 6px 12px;
      border-bottom: 1px solid #f0f1f4;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      background: #fafbfc;
    }
    .prop-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2.5px 8px;
      border-radius: 999px;
      border: 1px solid #e2e5ec;
      background: #ffffff;
      color: #4b5563;
      cursor: pointer;
    }
    .prop-pill:hover { background: #f3f4f6; }
    .prop-pill.active-tab { background: #1e1b4b; color: #fff; border-color: #1e1b4b; }

    .peek-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .peek-issue-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #111827;
      margin: 0;
      line-height: 1.3;
    }

    /* 紧凑型 Verdict 结果卡 */
    .verdict-box {
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 11.5px;
    }
    .verdict-box.ready { background: #ecfdf5; border-color: #a7f3d0; }
    .verdict-box.progress { background: #eff6ff; border-color: #bfdbfe; }
    .verdict-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .verdict-summary {
      font-size: 11px;
      color: #334155;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 紧凑型单行步骤流（限制 max-height: 210px 内部滚动，单行截断不撑长页面！） */
    .compact-run-box {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .compact-run-header {
      padding: 6px 9px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      user-select: none;
    }
    .compact-run-header:hover { background: #f1f5f9; }
    .compact-steps-list {
      max-height: 195px;
      overflow-y: auto;
      padding: 6px 8px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #475569;
    }
    .compact-step-row {
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compact-step-badge {
      font-size: 9px;
      padding: 0 4px;
      border-radius: 3px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 600;
      flex-shrink: 0;
    }
    .compact-step-badge.report { background: #dcfce7; color: #15803d; }
    .compact-step-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 底部紧凑评论框 */
    .sticky-composer {
      border-top: 1px solid #ebedf0;
      padding: 8px 10px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .composer-textarea {
      width: 100%;
      height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    .composer-textarea:focus { border-color: #4f46e5; }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      position: relative;
    }
    .trigger-chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(37, 99, 235, 0.3);
      background: rgba(37, 99, 235, 0.08);
      color: #1e40af;
    }
    .send-btn {
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .send-btn:hover { background: #4338ca; }
    .pill-btn {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 10.5px;
      font-weight: 600;
      color: #1f2329;
      cursor: pointer;
    }
    .pill-btn:hover { background: #f9fafb; }
  </style>
</head>
<body>
  <div class="workspace-frame" id="workspaceFrame">
    <!-- 1. 最左侧窄栏 -->
    <nav class="rail">
      <div class="rail-logo" title="实时态势 (Now)" onclick="switchCenterTab('now')">N</div>
      <div class="rail-icon active" id="railNowBtn" title="实时态势 (二部图)" onclick="switchCenterTab('now')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="rail-icon" id="railIssuesBtn" title="任务列表 (Issues)" onclick="switchCenterTab('issues')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7h8"/><path d="M8 12h8"/><path d="M8 17h5"/></svg>
      </div>
      <div class="rail-spacer"></div>
      <div class="rail-icon" id="toggleSidebarRailBtn" title="展开/收起侧边栏">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </div>
    </nav>

    <!-- 2. 二级侧边栏：清晰提供【⚡ 实时态势】与【📋 任务列表 (Issues)】双入口，彻底去除假任务 -->
    <aside class="contacts-pane">
      <div class="contacts-header">
        <h2 class="contacts-title">Nocturn</h2>
        <div class="collapse-btn" id="collapseSidebarBtn" title="收起侧边栏">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </div>
      </div>

      <!-- 核心双视图切换：实时态势 vs 任务列表 (Issues) -->
      <div class="primary-nav-btn active" id="navBtnNow" onclick="switchCenterTab('now')">
        <span class="primary-nav-left">⚡ 实时态势 (Now)</span>
        <span class="primary-nav-count" id="navCountNow">2</span>
      </div>
      <div class="primary-nav-btn" id="navBtnIssues" onclick="switchCenterTab('issues')">
        <span class="primary-nav-left">📋 任务列表 (Issues)</span>
        <span class="primary-nav-count" id="navCountIssues">2</span>
      </div>

      <div class="group-title"><span>小队 (点击聚焦)</span><span>2</span></div>
      <div class="nav-list">
        <div class="nav-row" data-left-key="squad:dev" onclick="selectSquadLeader('dev')">
          <div class="member-avatar" style="background:#4f46e5;border-radius:7px;">研</div>
          <div class="nav-meta">
            <div class="nav-name">研发小队</div>
            <div class="nav-desc">1 队长 + 2 组员</div>
          </div>
        </div>
        <div class="nav-row" data-left-key="squad:ops" onclick="selectSquadLeader('ops')">
          <div class="member-avatar" style="background:#7c3aed;border-radius:7px;">运</div>
          <div class="nav-meta">
            <div class="nav-name">实验与运维小队</div>
            <div class="nav-desc">1 队长 + 1 组员</div>
          </div>
        </div>
      </div>

      <div class="group-title">
        <span>长期智能体 (sota)</span>
        <span style="cursor:pointer;color:#4f46e5;" onclick="promptAddAgent()">+ 新增</span>
      </div>
      <div class="nav-list" id="sidebarAgentsList"></div>
    </aside>

    <!-- 3. 主面板区域（中间：实时态势二部图 / 任务列表 Issues + 右侧：紧凑型抽屉） -->
    <main class="main-surface">
      <div class="center-stage-pane">
        <!-- 顶部真实 sota 派单栏（支持同时填写或绑定 Issue） -->
        <div class="dispatch-bar">
          <span style="font-size:11.5px;font-weight:700;color:#3730a3;white-space:nowrap;">🟢 派单：</span>
          <input id="quickIssueBindInput" style="max-width:135px;flex:none;" placeholder="🔗 绑定 Issue (如 #12)" title="可选：输入要绑定的 GitHub Issue 编号或仓库#编号" />
          <input id="quickTaskInput" placeholder="输入需求（如：写一个 string-utils.js 实现反转字符串并通过单测），回车直接派给 sota 团队执行..." />
          <button class="send-btn" style="height:30px;white-space:nowrap;" onclick="submitLiveTaskFromBar()">🚀 派单给 sota</button>
        </div>

        <!-- 视图 1：实时态势二部图 (Now) -->
        <section class="now-card" id="centerViewNow">
          <div class="stats-header">
            <div class="stats-left">
              <div class="stat-block">
                <div class="stat-num" id="statAgentCount">5</div>
                <div class="stat-caption">个 sota 智能体在线</div>
              </div>
              <div class="stat-block">
                <div class="stat-num" id="totalTaskCount">2</div>
                <div class="stat-caption">个真实任务 (已清除 Mock)</div>
              </div>
            </div>

            <div class="legend-bar">
              <div class="legend-tag">
                <svg width="20" height="10" viewBox="0 0 20 10"><line x1="1" y1="5" x2="19" y2="5" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/></svg>
                <span>队长派单中</span>
              </div>
              <div class="legend-tag">
                <svg width="20" height="10" viewBox="0 0 20 10"><line x1="1" y1="5" x2="19" y2="5" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/></svg>
                <span>组员执行中</span>
              </div>
              <div class="legend-tag">
                <svg width="20" height="10" viewBox="0 0 20 10"><line x1="1" y1="5" x2="19" y2="5" stroke="#64748b" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/></svg>
                <span>等待回调</span>
              </div>
              <button class="pill-btn" id="clearSpotlightBtn" style="display:none;" onclick="focusAllNow()">✕ 显示全部</button>
            </div>
          </div>

          <div class="bipartite-stage" id="bipartiteStage">
            <div class="left-column" id="leftColumn"></div>
            <svg class="curves-svg" id="curvesSvg"></svg>
            <div class="right-column" id="rightColumn"></div>
          </div>
        </section>

        <!-- 视图 2：任务列表 (Issues) 面板 -->
        <section class="issues-board-card" id="centerViewIssues" style="display:none;">
          <div class="issues-filter-bar">
            <div class="filter-tabs">
              <div class="filter-tab active" data-filter="all" onclick="setIssueFilter('all')">全部任务</div>
              <div class="filter-tab" data-filter="active" onclick="setIssueFilter('active')">进行中</div>
              <div class="filter-tab" data-filter="in_review" onclick="setIssueFilter('in_review')">待审核 (Verdict: ready)</div>
              <div class="filter-tab" data-filter="done" onclick="setIssueFilter('done')">已完成</div>
            </div>
            <span style="font-size:11px;color:#64748b;">点击任意任务在右侧查看 Session，点 ✕ 可删除旧任务</span>
          </div>
          <div id="issuesListContainer"></div>
        </section>
      </div>

      <!-- 4. 右侧紧凑型 Session 抽屉（短小精悍、单行截断步骤、绝不拉长刷屏） -->
      <aside class="issue-peek-panel" id="issuePeekPanel">
        <div class="peek-header">
          <span class="peek-mode-badge" id="peekModeBadge">TASK-445</span>
          <div style="display:flex;align-items:center;gap:5px;">
            <button class="pill-btn" style="color:#1d4ed8;border-color:#93c5fd;background:#eff6ff;" onclick="triggerLiveSotaTurn()">🚀 sota 跑一轮</button>
            <span style="font-size:10px;color:#8f959e" id="peekHeaderSub">sota 在线</span>
          </div>
        </div>

        <div class="peek-props-bar" id="peekPropsBar"></div>

        <div class="peek-scroll" id="peekScroll"></div>

        <div class="sticky-composer">
          <textarea class="composer-textarea" id="composerInput" placeholder="向当前智能体发送插话 (--steer) 或返工要求..."></textarea>
          <div class="composer-footer">
            <div class="trigger-chip-btn" id="triggerChipBtn">
              <span id="triggerChipLabel">⚡ 插话到当前运行</span>
            </div>
            <button class="send-btn" id="sendCommentBtn">发送 ↵</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:4100";

    const squads = [
      {
        id: "dev",
        name: "研发小队",
        color: "#4f46e5",
        tag: "1 队长 · 2 组员",
        leaderId: "dev-leader",
        agents: [
          { id: "dev-leader", name: "研发小队队长", role: "队长", isLeader: true, sub: "gemini-4-argon-high", color: "#4f46e5", initials: "队长", dotType: "purple" },
          { id: "pi-coder", name: "pi-coder", role: "组员", isLeader: false, sub: "deepseek-v4.1-flash", color: "#2563eb", initials: "PI", dotType: "blue" },
          { id: "codex-reviewer", name: "codex-reviewer", role: "组员", isLeader: false, sub: "zgca/deepseek-flash", color: "#0d9488", initials: "审", dotType: "blue" }
        ]
      },
      {
        id: "ops",
        name: "实验与运维小队",
        color: "#7c3aed",
        tag: "1 队长 · 1 组员",
        leaderId: "ops-leader",
        agents: [
          { id: "ops-leader", name: "运维小队队长", role: "队长", isLeader: true, sub: "gemini-4-argon-high", color: "#7c3aed", initials: "队长", dotType: "purple" },
          { id: "bench-worker", name: "pi-bench", role: "组员", isLeader: false, sub: "zgca/deepseek-flash", color: "#2563eb", initials: "测", dotType: "blue" }
        ]
      }
    ];

    // 只保留你真正跑过的 2 个真实任务作为离线兜底（彻底删除所有假 Mock 任务！）
    let tasksData = [
      {
        id: "task_445",
        identifier: "TASK-445",
        boundIssue: "nocturn#445",
        title: "#445 画个鹈鹕骑自行车的s v g",
        squadId: "dev",
        status: "in_review",
        leaderAgentId: "dev-leader",
        assignedWorkerId: "pi-coder",
        hasSvgPreview: true,
        latestVerdict: {
          state: "ready",
          summary: "已在 sota:/home/qijinyin/multimodal/yangxin/nocturn/worktrees/task-445-pi-coder/pelican-bicycle.svg 完成绘制并通过渲染验证（18.8 KB）。"
        },
        leaderNote: "已调用 nocturn dispatch 委派给 @pi-coder 绘制 pelican-bicycle.svg 并验证 XML/渲染合法性。",
        steps: [
          { badge: "步骤", text: "dev-leader (gemini-4-argon-high) 派单 -> pi-coder (deepseek-v4.1-flash)" },
          { badge: "步骤", text: "write: /home/qijinyin/multimodal/yangxin/nocturn/worktrees/task-445-pi-coder/pelican-bicycle.svg (18,853B)" },
          { badge: "步骤", text: "bash: xmllint --noout pelican-bicycle.svg && cairosvg 渲染验证通过" },
          { badge: "Report", text: "Verdict=ready · 已完成鹈鹕骑自行车 SVG 绘制与验证" }
        ]
      },
      {
        id: "task_438",
        identifier: "TASK-438",
        boundIssue: "nocturn#438",
        title: "#438 编写 calc.js 斐波那契与四则运算模块并通过单测",
        squadId: "dev",
        status: "in_review",
        leaderAgentId: "dev-leader",
        assignedWorkerId: "pi-coder",
        latestVerdict: {
          state: "ready",
          summary: "已实现 calc.js (add/multiply/fib) 与 calc.test.js，执行 node calc.test.js：23 项断言全部通过。"
        },
        leaderNote: "已调用 nocturn dispatch 委派给 @pi-coder 实现 calc.js 算术与斐波那契模块并运行单测。",
        steps: [
          { badge: "步骤", text: "dev-leader 派单 -> pi-coder (/home/qijinyin/multimodal/yangxin/nocturn/worktrees/task-438-pi-coder)" },
          { badge: "步骤", text: "write: calc.js (1093B) & calc.test.js (3118B)" },
          { badge: "步骤", text: "bash: node calc.test.js -> 通过: 23 失败: 0 全部断言通过 ✅" },
          { badge: "Report", text: "Verdict=ready · 23/23 单测通过" }
        ]
      }
    ];

    let centerTab = "now"; // 'now' | 'issues'
    let drawerViewMode = "task"; // 'task' | 'leader' | 'worker'
    let issueFilter = "all";
    let selectedTaskId = "task_445";
    let selectedActorId = null;
    let selectedSquadId = null;
    let hoveredActorId = null;
    let hoveredPillId = null;
    let stepsExpanded = true;

    const leftCol = document.getElementById("leftColumn");
    const rightCol = document.getElementById("rightColumn");
    const svgEl = document.getElementById("curvesSvg");
    const stageEl = document.getElementById("bipartiteStage");
    const peekModeBadge = document.getElementById("peekModeBadge");
    const peekPropsBar = document.getElementById("peekPropsBar");
    const peekScrollEl = document.getElementById("peekScroll");
    const composerInput = document.getElementById("composerInput");

    // 将长命令或多行输出压缩成干净的单行（最多 78 个字符），彻底解决抽屉“又臭又长”
    function compactSingleLine(raw) {
      const oneLine = String(raw || "")
        .replace(/\s+/g, " ")
        .replace(/^\[sota 工具调用 · ([^\]]+)\]\s*/, "$1: ")
        .replace(/^\[sota Pi 1\.5\.0 回复\]\s*/, "回复: ")
        .trim();
      return oneLine.length > 78 ? oneLine.slice(0, 78) + "…" : oneLine;
    }

    function switchCenterTab(tab) {
      centerTab = tab;
      document.getElementById("centerViewNow").style.display = tab === "now" ? "flex" : "none";
      document.getElementById("centerViewIssues").style.display = tab === "issues" ? "flex" : "none";
      document.getElementById("navBtnNow").classList.toggle("active", tab === "now");
      document.getElementById("navBtnIssues").classList.toggle("active", tab === "issues");
      document.getElementById("railNowBtn").classList.toggle("active", tab === "now");
      document.getElementById("railIssuesBtn").classList.toggle("active", tab === "issues");
      syncUI();
    }

    function setIssueFilter(f) {
      issueFilter = f;
      document.querySelectorAll(".filter-tab").forEach(el => {
        el.classList.toggle("active", el.dataset.filter === f);
      });
      renderIssuesBoard();
    }

    function selectSquadLeader(squadId) {
      selectedSquadId = squadId;
      selectedActorId = squads.find(s => s.id === squadId)?.leaderId || "dev-leader";
      drawerViewMode = "leader";
      const firstSquadTask = tasksData.find(t => t.squadId === squadId);
      if (firstSquadTask) selectedTaskId = firstSquadTask.id;
      syncUI();
    }

    function selectWorker(workerId) {
      const isLeader = squads.some(s => s.leaderId === workerId);
      selectedActorId = workerId;
      selectedSquadId = null;
      drawerViewMode = isLeader ? "leader" : "worker";
      const workerTask = tasksData.find(t => t.assignedWorkerId === workerId || t.leaderAgentId === workerId);
      if (workerTask) selectedTaskId = workerTask.id;
      syncUI();
    }

    function selectTask(taskId) {
      selectedTaskId = taskId;
      selectedActorId = null;
      selectedSquadId = null;
      drawerViewMode = "task";
      syncUI();
    }

    // 在任务胶囊旁边直接点击绑定/修改关联的 Issue（如 GitHub Issue #12 或 nocturn#445）
    function promptBindIssue(taskId, ev) {
      if (ev) ev.stopPropagation();
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      const val = prompt(
        `为任务 ${t.identifier} 绑定外部或仓库 Issue（例如 poijygfdyy/nocturn#12 或 #445，绑定后该 Issue 的评论与 CI 将通过绿色通道直达执行组员 Session）：`,
        t.boundIssue || `nocturn#${t.identifier.replace("TASK-", "")}`
      );
      if (val === null) return;
      t.boundIssue = val.trim();
      selectedTaskId = t.id;
      drawerViewMode = "task";
      fetch(`${API_BASE}/api/tasks/bind-issue`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, issueRef: t.boundIssue })
      }).catch(() => {});
      syncUI();
    }

    function focusAllNow() {
      selectedActorId = null;
      selectedSquadId = null;
      syncUI();
    }

    function deleteTask(taskId, identifier, ev) {
      if (ev) ev.stopPropagation();
      tasksData = tasksData.filter(t => t.id !== taskId && t.identifier !== identifier);
      if (selectedTaskId === taskId && tasksData[0]) {
        selectedTaskId = tasksData[0].id;
      }
      fetch(`${API_BASE}/api/tasks/${encodeURIComponent(identifier)}`, { method: "DELETE" }).catch(() => {});
      syncUI();
    }

    function renderSidebarAgents() {
      const container = document.getElementById("sidebarAgentsList");
      let html = "";
      squads.forEach(s => {
        s.agents.forEach(a => {
          const isAct = selectedActorId === a.id;
          const myTasks = tasksData.filter(t => t.assignedWorkerId === a.id || (!t.assignedWorkerId && t.leaderAgentId === a.id));
          const subText = myTasks.length > 0 ? `负责: ${myTasks.map(x => x.identifier).join(", ")}` : a.sub;
          html += `
            <div class="nav-row ${isAct ? 'active' : ''}" onclick="selectWorker('${a.id}')">
              <div class="member-avatar-wrap">
                <div class="member-avatar" style="background:${a.color}">${a.initials}</div>
                <span class="online-dot"></span>
              </div>
              <div class="nav-meta">
                <div class="nav-name">${a.name} <span class="role-badge ${a.isLeader ? 'leader' : 'worker'}">${a.role}</span></div>
                <div class="nav-desc">${subText}</div>
              </div>
            </div>
          `;
        });
      });
      container.innerHTML = html;
    }

    function renderIssuesBoard() {
      const container = document.getElementById("issuesListContainer");
      const filtered = tasksData.filter(t => {
        if (issueFilter === "active") return t.status === "dispatching" || t.status === "in_progress";
        if (issueFilter === "in_review") return t.status === "in_review";
        if (issueFilter === "done") return t.status === "done";
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:28px;text-align:center;color:#94a3b8;font-size:12px;">当前分类下暂无任务，可在顶部输入框直接新建派单</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const statusText = t.status === "in_review" ? "待审核 (ready)" : (t.status === "done" ? "已完成" : (t.status === "dispatching" ? "队长派单中" : "执行中"));
        const badgeClass = t.status === "in_review" || t.status === "done" ? "ready" : (t.status === "dispatching" ? "dispatch" : "progress");
        const owner = t.assignedWorkerId || t.leaderAgentId;
        const summary = t.latestVerdict?.summary || "正在 sota 上执行中...";
        return `
          <div class="issue-row ${t.id === selectedTaskId ? 'selected' : ''}" onclick="selectTask('${t.id}')">
            <div class="issue-row-left">
              <span class="issue-code">${t.identifier}</span>
              <span class="issue-row-title">${t.title}</span>
              <span class="issue-row-summary">${summary}</span>
            </div>
            <div class="issue-row-right">
              <span style="font-size:11px;color:#475569;font-weight:600;">@${owner}</span>
              <span class="verdict-mini-badge ${badgeClass}">${statusText}</span>
              <button class="del-btn" title="删除此任务" onclick="deleteTask('${t.id}', '${t.identifier}', event)">✕</button>
            </div>
          </div>
        `;
      }).join("");
    }

    // 渲染右侧紧凑型抽屉（支持 3 种紧凑视角：1. 队长调度 Session / 2. 组员终端 Session / 3. 任务与绑定 Issue 详情）
    function renderCompactDrawer() {
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) {
        peekScrollEl.innerHTML = `<div style="color:#94a3b8;font-size:12px;padding:20px 0;text-align:center;">暂无选中任务，请在顶部输入框新建任务</div>`;
        return;
      }

      const owner = t.assignedWorkerId || t.leaderAgentId || "pi-coder";

      // 视角 1：点击了左侧【队长】或【小队】 -> 紧凑展示队长自己的调度 Session
      if (drawerViewMode === "leader") {
        const s = squads.find(x => x.id === (selectedSquadId || t.squadId)) || squads[0];
        const leader = s.agents[0];
        const squadTasks = tasksData.filter(x => x.squadId === s.id);
        peekModeBadge.textContent = `👑 ${leader.name} · 调度 Session`;
        document.getElementById("triggerChipLabel").textContent = `⚡ 对 ${leader.name} 插话`;

        peekPropsBar.innerHTML = s.agents.map(a => `
          <div class="prop-pill ${a.id === leader.id ? 'active-tab' : ''}" onclick="selectWorker('${a.id}')">
            ${a.isLeader ? '👑' : '🟢'} ${a.name}
          </div>
        `).join("");

        peekScrollEl.innerHTML = squadTasks.map(st => `
          <div class="verdict-box progress" style="cursor:pointer;" onclick="selectTask('${st.id}')">
            <div class="verdict-header">
              <span>${st.identifier} · ${st.boundIssue ? '🔗 ' + st.boundIssue : '未绑 Issue'}</span>
              <span>派给 @${st.assignedWorkerId || '待定'} ›</span>
            </div>
            <div style="font-weight:600;color:#111827;margin-bottom:3px;">${st.title}</div>
            <div class="verdict-summary">${st.leaderNote || `已调用 nocturn dispatch 派给 @${st.assignedWorkerId}，当前状态：${st.status}`}</div>
          </div>
        `).join("");
        return;
      }

      // 视角 2：点击了左侧【执行组员 (如 pi-coder)】 -> 紧凑展示该组员的个人终端 Session
      if (drawerViewMode === "worker" && selectedActorId) {
        const myTasks = tasksData.filter(x => x.assignedWorkerId === selectedActorId);
        const curTask = myTasks.find(x => x.id === selectedTaskId) || myTasks[0] || t;
        peekModeBadge.textContent = `⚡ ${selectedActorId} · 终端 Session`;
        document.getElementById("triggerChipLabel").textContent = `⚡ 对 ${selectedActorId} 插话`;

        peekPropsBar.innerHTML = `
          <div class="prop-pill" onclick="selectSquadLeader('${curTask.squadId}')">← 👑 队长</div>
          ${myTasks.map(mt => `
            <div class="prop-pill ${mt.id === curTask.id ? 'active-tab' : ''}" onclick="selectedTaskId='${mt.id}';syncUI();">
              ${mt.status === 'in_review' ? '✅' : '🟢'} ${mt.identifier}
            </div>
          `).join("")}
        `;

        const rawSteps = (curTask.steps || []).filter(s => !String(s.text).startsWith("[sota Pi 1.5.0 回复] I'll start by inspecting"));
        const stepsHtml = rawSteps.slice(-12).map(st => {
          const clean = compactSingleLine(st.text);
          const isReport = st.badge === "Report" || st.badge === "report";
          return `
            <div class="compact-step-row" title="${String(st.text).replace(/"/g, '&quot;')}">
              <span class="compact-step-badge ${isReport ? 'report' : ''}">${isReport ? '结论' : '终端'}</span>
              <span class="compact-step-text">${clean}</span>
            </div>
          `;
        }).join("");

        peekScrollEl.innerHTML = `
          <h3 class="peek-issue-title">${curTask.title}</h3>
          <div class="verdict-box ${curTask.latestVerdict?.state || 'progress'}">
            <div class="verdict-header">
              <span>当前进展 (${curTask.status})</span>
              <span style="cursor:pointer;color:#4f46e5;" onclick="promptBindIssue('${curTask.id}', event)">🔗 ${curTask.boundIssue || '绑定 Issue'}</span>
            </div>
            <div class="verdict-summary">${curTask.latestVerdict?.summary || '正在 sota 工作区执行...'}</div>
          </div>
          <div class="compact-run-box">
            <div class="compact-run-header" onclick="stepsExpanded = !stepsExpanded; renderCompactDrawer();">
              <span>⚡ ${selectedActorId} 实时步骤 (${rawSteps.length} 步)</span>
              <span style="color:#64748b;font-size:10px;">${stepsExpanded ? '收起 ▲' : '展开 ▼'}</span>
            </div>
            <div class="compact-steps-list" style="display:${stepsExpanded ? 'flex' : 'none'}">
              ${stepsHtml}
            </div>
          </div>
        `;
        return;
      }

      // 视角 3：点击了右侧【任务胶囊】或【🔗 绑定 Issue】 -> 展示 Issue 绑定与交付详情
      peekModeBadge.textContent = `📋 ${t.identifier} · Issue 详情`;
      document.getElementById("triggerChipLabel").textContent = `⚡ 对 ${owner} 插话`;

      const statusLabel = t.status === "in_review" ? "待审核" : (t.status === "done" ? "已完成" : "进行中");
      const dotClass = t.status === "in_review" ? "in_review" : (t.status === "dispatching" ? "dispatching" : "running");

      peekPropsBar.innerHTML = `
        <div class="prop-pill" onclick="cycleTaskStatus('${t.id}')">
          <span class="task-dot ${dotClass}"></span>
          <span>${statusLabel} ▾</span>
        </div>
        <div class="prop-pill" style="border-color:#c7d2fe;background:#eef2ff;color:#4338ca;" onclick="promptBindIssue('${t.id}', event)" title="点击绑定或修改关联的 GitHub Issue">
          <span>🔗 ${t.boundIssue ? '已绑 ' + t.boundIssue : '+ 绑定 Issue'}</span>
        </div>
        <div class="prop-pill" onclick="triggerTargetedRework('${t.id}')">↩️ 返工</div>
        <div class="prop-pill" style="margin-left:auto;color:#dc2626;" onclick="deleteTask('${t.id}', '${t.identifier}', event)">删除</div>
      `;

      const svgPreviewHtml = (t.identifier === "TASK-445" || t.hasSvgPreview) ? `
        <div style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#f8fafc;">
          <img src="${API_BASE}/api/pelican.svg" style="width:100%;max-height:150px;object-fit:contain;display:block;" alt="SVG Preview" onerror="this.parentElement.style.display='none'"/>
        </div>
      ` : "";

      const vState = t.latestVerdict?.state || (t.status === "in_review" ? "ready" : "progress");
      const vSummary = t.latestVerdict?.summary || "正在 sota 工作区执行中...";

      const rawSteps = (t.steps || []).filter(s => !String(s.text).startsWith("[sota Pi 1.5.0 回复] I'll start by inspecting"));
      const recentSteps = rawSteps.slice(-10);
      const stepsHtml = recentSteps.map(st => {
        const clean = compactSingleLine(st.text);
        const isReport = st.badge === "Report" || st.badge === "report";
        return `
          <div class="compact-step-row" title="${String(st.text).replace(/"/g, '&quot;')}">
            <span class="compact-step-badge ${isReport ? 'report' : ''}">${isReport ? '结论' : '步骤'}</span>
            <span class="compact-step-text">${clean}</span>
          </div>
        `;
      }).join("");

      peekScrollEl.innerHTML = `
        <h3 class="peek-issue-title">${t.title}</h3>

        ${svgPreviewHtml}

        <div class="verdict-box ${vState}">
          <div class="verdict-header">
            <span>准出结果 (Verdict: ${vState})</span>
            <span style="cursor:pointer;color:#2563eb;" onclick="selectWorker('${owner}')">执行人: @${owner} ›</span>
          </div>
          <div class="verdict-summary" title="${vSummary.replace(/"/g, '&quot;')}">${vSummary}</div>
        </div>

        <div class="compact-run-box">
          <div class="compact-run-header" onclick="stepsExpanded = !stepsExpanded; renderCompactDrawer();">
            <span>⚡ Session 步骤记录 (${rawSteps.length} 步)</span>
            <span style="color:#64748b;font-size:10px;">${stepsExpanded ? '收起 ▲' : '展开 ▼'}</span>
          </div>
          <div class="compact-steps-list" style="display:${stepsExpanded ? 'flex' : 'none'}">
            ${stepsHtml || '<div style="color:#94a3b8;">等待 sota 返回步骤...</div>'}
          </div>
        </div>
      `;
    }

    function cycleTaskStatus(taskId) {
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      t.status = t.status === "in_progress" ? "in_review" : (t.status === "in_review" ? "done" : "in_progress");
      fetch(`${API_BASE}/api/tasks/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, status: t.status })
      }).catch(() => {});
      syncUI();
    }

    function triggerTargetedRework(taskId) {
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      const reason = prompt(`请输入对 ${t.identifier} 的驳回修改意见（将在 sota 上恢复原会话继续改）：`, "请再补充一个边界测试并重新汇报");
      if (!reason) return;
      t.status = "in_progress";
      t.steps.push({ badge: "步骤", text: `↩️ 驳回返工：${reason}` });
      fetch(`${API_BASE}/api/rework`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, reviewer: "yangxin", reason })
      }).catch(() => {});
      syncUI();
    }

    function submitLiveTaskFromBar() {
      const inp = document.getElementById("quickTaskInput");
      const bindInp = document.getElementById("quickIssueBindInput");
      const val = (inp.value || "").trim();
      if (!val) {
        inp.focus();
        return;
      }
      const num = 446 + tasksData.length;
      const newCode = "TASK-" + num;
      const boundIssue = (bindInp.value || "").trim() || `nocturn#${num}`;
      const newTask = {
        id: "task_" + Date.now(),
        identifier: newCode,
        boundIssue,
        title: `#${num} ${val}`,
        squadId: "dev",
        status: "dispatching",
        leaderAgentId: "dev-leader",
        assignedWorkerId: null,
        latestVerdict: { state: "progress", summary: "正在唤醒 sota 上的研发队长派单..." },
        steps: [{ badge: "步骤", text: `已提交 ${newCode} (绑定 ${boundIssue})，正在 sota 上拉起研发队长...` }]
      };
      tasksData.unshift(newTask);
      selectedTaskId = newTask.id;
      drawerViewMode = "task";
      inp.value = "";
      bindInp.value = "";
      syncUI();

      fetch(`${API_BASE}/api/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          identifier: newCode,
          title: `#${num} ${val}`,
          description: `${val}（关联 Issue: ${boundIssue}。请研发队长调用 nocturn dispatch 委派给 pi-coder 实现并验证，完成后立即调用 nocturn report --state ready 交付）`,
          squadId: "dev"
        })
      }).then(() => {
        fetch(`${API_BASE}/api/tasks/bind-issue`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ taskId: newCode, issueRef: boundIssue })
        }).catch(() => {});
      }).catch(() => {});
    }

    function triggerLiveSotaTurn() {
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const agentId = t.assignedWorkerId || t.leaderAgentId || "pi-coder";
      t.steps.push({ badge: "步骤", text: `正在连接 sota 拉起 ${agentId}...` });
      syncUI();

      fetch(`${API_BASE}/api/sota/exec`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          taskId: t.identifier,
          agentId,
          prompt: `请用一句话汇报你在任务 ${t.identifier} 工作区下的当前文件与状态。`
        })
      })
        .then(r => r.json())
        .then(data => {
          if (data && data.sotaReply) {
            t.steps.push({ badge: "步骤", text: `回复: ${data.sotaReply}` });
            syncUI();
          }
        })
        .catch(() => {});
    }

    function promptAddAgent() {
      const id = prompt("新智能体 ID（如 codex-fixer）：", "codex-fixer");
      if (!id) return;
      const name = prompt("显示名称：", id);
      squads[0].agents.push({
        id,
        name: name || id,
        role: "组员",
        isLeader: false,
        sub: "deepseek-flash",
        color: "#0284c7",
        initials: (name || id).slice(0, 2).toUpperCase(),
        dotType: "blue"
      });
      fetch(`${API_BASE}/api/agents`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, name, squadId: "dev", role: "worker", cli: "pi" })
      }).catch(() => {});
      syncUI();
    }

    function syncUI() {
      document.getElementById("totalTaskCount").textContent = String(tasksData.length);
      document.getElementById("navCountNow").textContent = String(tasksData.length);
      document.getElementById("navCountIssues").textContent = String(tasksData.length);
      document.getElementById("clearSpotlightBtn").style.display = (selectedActorId || selectedSquadId) ? "inline-flex" : "none";

      renderSidebarAgents();
      renderIssuesBoard();
      renderCompactDrawer();

      // 渲染二部图左列
      leftCol.innerHTML = "";
      squads.forEach(s => {
        const pod = document.createElement("div");
        const dimmed = selectedSquadId && selectedSquadId !== s.id;
        pod.className = "squad-pod" + (selectedSquadId === s.id ? " focused-pod" : "") + (dimmed ? " dimmed-pod" : "");

        const header = document.createElement("div");
        header.className = "squad-pod-header";
        header.innerHTML = `
          <span class="squad-pod-name"><span class="squad-pod-dot" style="background:${s.color}"></span>${s.name}</span>
          <span class="squad-pod-tag">${s.agents.length}人</span>
        `;
        header.addEventListener("click", () => selectSquadLeader(s.id));
        pod.appendChild(header);

        s.agents.forEach(a => {
          const node = document.createElement("div");
          const isSelected = selectedActorId === a.id;
          const isDim = (selectedActorId && selectedActorId !== a.id) || (selectedSquadId && selectedSquadId !== s.id);
          node.className = "actor-node" + (a.isLeader ? "" : " worker-indent") + (isSelected ? " selected-actor" : "") + (isDim ? " dimmed-actor" : "");
          node.dataset.actorId = a.id;

          node.innerHTML = `
            <div class="actor-left">
              <div class="actor-avatar" style="background:${a.color}">${a.initials}</div>
              <div>
                <div class="actor-name">${a.name}</div>
                <div class="actor-sub">${a.sub}</div>
              </div>
            </div>
            <span class="origin-dot ${a.dotType === 'blue' ? 'blue' : ''}"></span>
          `;
          node.addEventListener("mouseenter", () => { hoveredActorId = a.id; drawCurves(); });
          node.addEventListener("mouseleave", () => { hoveredActorId = null; drawCurves(); });
          node.addEventListener("click", (e) => { e.stopPropagation(); selectWorker(a.id); });
          pod.appendChild(node);
        });
        leftCol.appendChild(pod);
      });

      // 渲染二部图右列（只画真实任务！）
      rightCol.innerHTML = "";
      tasksData.forEach(t => {
        const el = document.createElement("div");
        const isSelected = t.id === selectedTaskId;
        const isDim = (selectedSquadId && t.squadId !== selectedSquadId) ||
          (selectedActorId && t.assignedWorkerId !== selectedActorId && t.leaderAgentId !== selectedActorId);
        el.className = "task-pill" + (isSelected ? " selected-pill" : "") + (isDim ? " dimmed-pill" : "");
        el.dataset.pillId = t.id;

        const dotClass = t.status === "in_review" ? "in_review" : (t.status === "dispatching" ? "dispatching" : "running");
        const badgeClass = t.status === "in_review" || t.status === "done" ? "ready" : (t.status === "dispatching" ? "dispatch" : "progress");
        const badgeText = t.status === "in_review" ? "待审核 (ready)" : (t.status === "done" ? "已完成" : (t.assignedWorkerId ? `${t.assignedWorkerId} 执行中` : "队长派单中"));
        const issueLabel = t.boundIssue ? `🔗 ${t.boundIssue}` : `+ 绑定 Issue`;

        el.innerHTML = `
          <div class="task-pill-left">
            <span class="task-dot ${dotClass}"></span>
            <span class="task-title">${t.title}</span>
          </div>
          <span class="issue-bind-chip ${t.boundIssue ? 'bound' : ''}" onclick="promptBindIssue('${t.id}', event)" title="点击绑定或修改关联的 GitHub Issue">${issueLabel}</span>
          <span class="verdict-mini-badge ${badgeClass}">${badgeText}</span>
        `;
        el.addEventListener("mouseenter", () => { hoveredPillId = t.id; drawCurves(); });
        el.addEventListener("mouseleave", () => { hoveredPillId = null; drawCurves(); });
        el.addEventListener("click", () => selectTask(t.id));
        rightCol.appendChild(el);
      });

      requestAnimationFrame(drawCurves);
    }

    function drawCurves() {
      if (centerTab !== "now") return;
      const stageRect = stageEl.getBoundingClientRect();
      if (stageRect.width === 0) return;
      const actorAnchors = {};
      const pillAnchors = {};

      leftCol.querySelectorAll(".actor-node").forEach(node => {
        const dotEl = node.querySelector(".origin-dot");
        const r = dotEl.getBoundingClientRect();
        actorAnchors[node.dataset.actorId] = {
          x: r.left - stageRect.left + r.width / 2,
          y: r.top - stageRect.top + r.height / 2
        };
      });

      rightCol.querySelectorAll(".task-pill").forEach(el => {
        const r = el.getBoundingClientRect();
        pillAnchors[el.dataset.pillId] = {
          x: r.left - stageRect.left,
          y: r.top - stageRect.top + r.height / 2
        };
      });

      svgEl.setAttribute("viewBox", `0 0 ${stageRect.width} ${stageRect.height}`);
      svgEl.innerHTML = "";

      tasksData.forEach(t => {
        const dst = pillAnchors[t.id];
        if (!dst) return;
        const links = [{ actorId: t.leaderAgentId, type: t.assignedWorkerId ? "waiting" : "dispatching" }];
        if (t.assignedWorkerId) links.push({ actorId: t.assignedWorkerId, type: "running" });

        links.forEach(l => {
          const src = actorAnchors[l.actorId];
          if (!src) return;
          const span = dst.x - src.x;
          const pathData = `M ${src.x} ${src.y} C ${src.x + span * 0.46} ${src.y}, ${dst.x - span * 0.46} ${dst.y}, ${dst.x} ${dst.y}`;

          const dimmed = (hoveredActorId && hoveredActorId !== l.actorId) ||
            (hoveredPillId && hoveredPillId !== t.id) ||
            (selectedActorId && selectedActorId !== l.actorId) ||
            (selectedSquadId && t.squadId !== selectedSquadId);

          const color = l.type === "running" ? "#2563eb" : (l.type === "dispatching" ? "#7c3aed" : "#64748b");
          const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
          line.setAttribute("d", pathData);
          line.setAttribute("fill", "none");
          line.setAttribute("stroke", color);
          line.setAttribute("stroke-width", dimmed ? "1.1" : (l.type === "waiting" ? "1.4" : "2.2"));
          line.setAttribute("opacity", dimmed ? "0.15" : (l.type === "waiting" ? "0.6" : "0.95"));
          if (l.type === "waiting") line.setAttribute("stroke-dasharray", "4 4");
          svgEl.appendChild(line);
        });
      });
    }

    document.getElementById("sendCommentBtn").addEventListener("click", () => {
      const val = composerInput.value.trim();
      if (!val) return;
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const targetAgent = t.assignedWorkerId || t.leaderAgentId || "pi-coder";
      t.steps.push({ badge: "步骤", text: `⚡ 你对 ${targetAgent} 插话: ${val}` });
      composerInput.value = "";
      syncUI();

      fetch(`${API_BASE}/api/sota/exec`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, agentId: targetAgent, prompt: val })
      })
        .then(r => r.json())
        .then(data => {
          if (data && data.sotaReply) {
            t.steps.push({ badge: "步骤", text: `回复: ${data.sotaReply}` });
            syncUI();
          }
        })
        .catch(() => {});
    });

    document.getElementById("quickTaskInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitLiveTaskFromBar();
    });

    const frameEl = document.getElementById("workspaceFrame");
    function toggleSidebar() {
      frameEl.classList.toggle("sidebar-collapsed");
      setTimeout(() => requestAnimationFrame(drawCurves), 180);
    }
    document.getElementById("collapseSidebarBtn").addEventListener("click", toggleSidebar);
    document.getElementById("toggleSidebarRailBtn").addEventListener("click", toggleSidebar);

    // 100% 同步后端 SQLite 中的真实任务（不掺杂任何 Mock 假任务）
    function applyBackendSnapshot(snap) {
      if (!snap || !Array.isArray(snap.tasks)) return;
      document.getElementById("peekHeaderSub").textContent = `SQLite (${snap.tasks.length})`;
      if (snap.tasks.length === 0) return;

      tasksData = snap.tasks.map(t => {
        const taskRuns = (snap.runs || []).filter(r => r.taskId === t.id);
        const allSteps = [];
        taskRuns.forEach(r => {
          (r.steps || []).forEach(st => allSteps.push(st));
        });
        return {
          id: t.id,
          identifier: t.identifier,
          boundIssue: t.boundIssue || `nocturn#${t.identifier.replace("TASK-", "")}`,
          title: t.title,
          squadId: t.squadId || "dev",
          status: t.status,
          leaderAgentId: t.leaderAgentId || "dev-leader",
          assignedWorkerId: t.assignedWorkerId,
          hasSvgPreview: t.identifier === "TASK-445",
          latestVerdict: t.latestVerdict,
          steps: allSteps
        };
      });

      if (!tasksData.some(x => x.id === selectedTaskId) && tasksData[0]) {
        selectedTaskId = tasksData[0].id;
      }
      syncUI();
    }

    try {
      const es = new EventSource(API_BASE + "/api/events");
      es.onmessage = (ev) => {
        try {
          applyBackendSnapshot(JSON.parse(ev.data));
        } catch {}
      };
    } catch {}

    window.addEventListener("resize", () => requestAnimationFrame(drawCurves));
    syncUI();
  </script>
</body>
</html>
