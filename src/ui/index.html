<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nocturn — 按 Issue 隔离的多智能体连线与介入工作台</title>
  <style>
    :root {
      color-scheme: light;
      --bg-app: #f6f7f9;
      --bg-main: #ffffff;
      --bg-sidebar: #f6f7f9;
      --bg-hover: #eef0f4;
      --bg-active: #dfe6ff;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --text-muted: #8f959e;
      --border-subtle: #ebedf0;
      --border-card: #e5e7eb;
      --border-pill: #e2e5ec;
      --blue-line: #2563eb;
      --purple-line: #7c3aed;
      --green-line: #10b981;
      --gray-line: #64748b;
      --green-online: #22c55e;

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Inter", sans-serif;
      color: var(--text-primary);
      background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      overflow: hidden;
    }

    .workspace-frame {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      height: 100vh;
      background: var(--bg-app);
    }

    /* ============================================================================
       1. 左侧栏：按 Issue 物理隔离的导航栏（每个 Issue 是一个独立沙盒，不同 Issue 绝不串线！）
       ============================================================================ */
    .issue-sidebar {
      background: var(--bg-sidebar);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-right: 1px solid var(--border-subtle);
      user-select: none;
      overflow-y: auto;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 2px;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }
    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #1e1b4b;
      color: #fff;
      font-size: 12.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .brand-logo::after {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      border: 1.5px solid var(--bg-sidebar);
    }

    .new-issue-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(79, 70, 229, 0.25);
    }
    .new-issue-btn:hover { background: #4338ca; }

    .sidebar-section-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #8f959e;
      padding: 6px 4px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .issue-nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .issue-nav-card {
      padding: 8px 9px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.12s;
    }
    .issue-nav-card:hover { background: #e8ebf0; }
    .issue-nav-card.active {
      background: var(--bg-active);
      border-color: #c7d2fe;
    }
    .issue-nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .issue-nav-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: #4f46e5;
    }
    .issue-nav-status {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .issue-nav-status.running { background: #dbeafe; color: #1d4ed8; }
    .issue-nav-status.review { background: #fef3c7; color: #b45309; }
    .issue-nav-status.done { background: #d1fae5; color: #047857; }
    .issue-nav-title {
      font-size: 12px;
      font-weight: 600;
      color: #1f2329;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .issue-nav-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
    }

    /* ============================================================================
       2. 主工作台：当前选中 Issue 的专属连线舞台（左半屏） + 当前选中回合/Agent 的 Session 抽屉（右半屏）
       ============================================================================ */
    .main-surface {
      background: var(--bg-main);
      margin: 6px 6px 6px 0;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      display: flex;
      min-width: 0;
      height: calc(100vh - 12px);
      overflow: hidden;
    }

    .issue-stage-pane {
      flex: 1;
      min-width: 0;
      padding: 16px 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 当前 Issue 顶部信息栏 */
    .issue-header-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .issue-header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .issue-header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .issue-title-main {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .worktree-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #475569;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 2px 7px;
      border-radius: 5px;
    }
    .issue-bind-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid #c7d2fe;
      color: #4338ca;
      background: #eef2ff;
      cursor: pointer;
    }

    /* ============================================================================
       核心设计：按当前 Issue 隔离的「小队智能体 ⇄ 本 Issue 回合 Session」二部图连线卡
       （左边是参与本 Issue 的智能体，右边是本 Issue 经历的第 1..4 棒 Session 胶囊，点谁就在右边展开谁！）
       ============================================================================ */
    .now-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .now-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .legend-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: #646a73;
    }
    .legend-tag { display: inline-flex; align-items: center; gap: 5px; }

    .bipartite-stage {
      position: relative;
      display: grid;
      grid-template-columns: 194px minmax(64px, 15%) minmax(220px, 1fr);
      min-height: 250px;
      align-items: center;
    }
    .left-column {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
    }
    .squad-pod {
      background: #f8f9fb;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 8px 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .squad-pod-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 5px;
      border-bottom: 1px dashed #e2e5ec;
      font-size: 11px;
      font-weight: 700;
      color: #374151;
    }
    .actor-node {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 6px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s;
    }
    .actor-node:hover { background: #eef0f4; }
    .actor-node.selected-actor {
      background: #dfe6ff;
      border-color: #818cf8;
    }
    .actor-node.worker-indent { padding-left: 10px; position: relative; }
    .actor-node.worker-indent::before {
      content: ""; position: absolute; left: 3px; top: -4px; bottom: 50%;
      width: 4px; border-left: 1.5px solid #d1d5db; border-bottom: 1.5px solid #d1d5db;
    }
    .actor-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .actor-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .actor-name { font-size: 11.5px; font-weight: 600; color: #1f2329; white-space: nowrap; }
    .actor-sub { font-size: 9.5px; color: #8f959e; white-space: nowrap; }
    .origin-dot {
      width: 6.5px; height: 6.5px; border-radius: 50%;
      background: var(--purple-line); flex-shrink: 0;
    }
    .origin-dot.blue { background: var(--blue-line); }
    .origin-dot.green { background: var(--green-line); }

    /* 右列：本 Issue 内部按时间顺序排列的各个 Run / Session 胶囊（点击任意一棒，右侧直接展开该棒的 Session 详情！） */
    .right-column {
      grid-column: 3;
      display: flex;
      flex-direction: column;
      gap: 9px;
      z-index: 2;
      min-width: 0;
    }
    .run-pill {
      min-height: 42px;
      background: #ffffff;
      border: 1px solid var(--border-pill);
      border-radius: 10px;
      padding: 6px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .run-pill:hover { border-color: #6366f1; }
    .run-pill.selected-pill {
      border-color: #4f46e5;
      background: #f5f7ff;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
    }
    .run-pill-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }
    .run-pill-stage {
      font-size: 11px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .run-pill-summary {
      font-size: 10.5px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .run-pill-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .run-pill-badge.done { background: #d1fae5; color: #047857; }
    .run-pill-badge.running { background: #dbeafe; color: #1d4ed8; }

    .curves-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    /* 本 Issue 的交付物与 sota 源码卡片 */
    .deliverables-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .file-pills-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .file-pill {
      font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 6px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #1e293b;
      cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .file-pill:hover { border-color: #6366f1; }
    .file-pill.active { background: #1e1b4b; color: #fff; border-color: #1e1b4b; }
    .code-viewer-box {
      background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; line-height: 1.45; max-height: 230px; overflow: auto; white-space: pre;
    }

    /* ============================================================================
       3. 右侧伴随式 Session 抽屉：展示当前在连线图里点中的那一棒 Session 详情 + 直接向它插话介入！
       ============================================================================ */
    .session-peek-drawer {
      width: 400px;
      border-left: 1px solid #e5e7eb;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
    }
    .drawer-header {
      padding: 11px 14px;
      border-bottom: 1px solid #ebedf0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #fafbfc;
    }
    .drawer-turn-tabs {
      padding: 7px 14px;
      border-bottom: 1px solid #f0f1f4;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      background: #ffffff;
    }
    .turn-tab-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #e2e5ec;
      background: #f8fafc;
      color: #4b5563;
      cursor: pointer;
    }
    .turn-tab-pill.active {
      background: #1e1b4b;
      color: #ffffff;
      border-color: #1e1b4b;
    }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .verdict-box {
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #a7f3d0;
      background: #ecfdf5;
      font-size: 12px;
      color: #1e293b;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .steps-box {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }
    .steps-box-header {
      padding: 7px 10px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      display: flex;
      justify-content: space-between;
    }
    .steps-list {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      color: #475569;
    }

    .sticky-composer {
      border-top: 1px solid #ebedf0;
      padding: 10px 12px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .composer-textarea {
      width: 100%;
      height: 52px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    .composer-textarea:focus { border-color: #4f46e5; }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      position: relative;
    }
    .trigger-chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3.5px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      border: 1px solid rgba(37, 99, 235, 0.3);
      background: rgba(37, 99, 235, 0.08);
      color: #1e40af;
      cursor: pointer;
    }
    .send-btn {
      background: #4f46e5; color: #ffffff; border: none;
      border-radius: 7px; padding: 5px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .send-btn:hover { background: #4338ca; }
    .pill-btn {
      background: #ffffff; border: 1px solid #d1d5db;
      border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600;
      color: #1f2329; cursor: pointer;
    }
    .pill-btn:hover { background: #f9fafb; }

    /* 新建 Issue 弹窗 */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.35);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 500px; background: #ffffff; border-radius: 14px;
      border: 1px solid #e5e7eb; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
      padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-input {
      width: 100%; height: 36px; border: 1px solid #d1d5db;
      border-radius: 8px; padding: 0 10px; font-size: 13px; outline: none;
    }
    .modal-textarea {
      width: 100%; height: 80px; border: 1px solid #d1d5db;
      border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
      font-family: inherit; resize: none; outline: none;
    }
  </style>
</head>
<body>
  <div class="workspace-frame">
    <!-- 1. 左侧栏：严格按 Issue 隔离切换（点哪个 Issue，右边整个画布就进入哪个 Issue 的独立沙盒！） -->
    <aside class="issue-sidebar">
      <div class="sidebar-brand">
        <div class="brand-left">
          <div class="brand-logo">N</div>
          <span>Nocturn</span>
        </div>
        <span style="font-size:10.5px;color:#15803d;font-weight:600;">🟢 sota 在线</span>
      </div>

      <button class="new-issue-btn" onclick="openCreateModal()">＋ 新建任务 (New Issue)</button>

      <div class="sidebar-section-title">
        <span>任务列表 (按 Issue 隔离)</span>
        <span id="sidebarIssueCount">4</span>
      </div>
      <div class="issue-nav-list" id="issueNavList"></div>
    </aside>

    <!-- 2. 主画面：当前选中 Issue 的内部连线拓扑（左小队成员 ⇄ 右本 Issue 的各棒 Session） + 右侧选中 Session 详情与介入抽屉 -->
    <main class="main-surface">
      <div class="issue-stage-pane">
        <!-- 当前 Issue 顶栏 -->
        <div class="issue-header-card" id="issueHeaderCard"></div>

        <!-- 当前 Issue 专属的二部图：左边是小队成员，右边是这个 Issue 自己的第 1..4 棒 Session 胶囊 -->
        <section class="now-card">
          <div class="now-card-header">
            <div>
              <div style="font-size:13.5px;font-weight:700;color:#111827;" id="graphCardTitle">⚡ 本 Issue 内部接力拓扑 (点击任意智能体或回合胶囊，在右侧查看其 Session 并介入)</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">每个 Issue 拥有独立 Worktree 与独立 Session 链，不同 Issue 之间完全隔离、绝不串线</div>
            </div>
            <div class="legend-bar">
              <span class="legend-tag"><svg width="18" height="8"><line x1="1" y1="4" x2="17" y2="4" stroke="#7c3aed" stroke-width="2.5"/></svg>队长派单/转交</span>
              <span class="legend-tag"><svg width="18" height="8"><line x1="1" y1="4" x2="17" y2="4" stroke="#2563eb" stroke-width="2.5"/></svg>pi-coder 编码</span>
              <span class="legend-tag"><svg width="18" height="8"><line x1="1" y1="4" x2="17" y2="4" stroke="#10b981" stroke-width="2.5"/></svg>reviewer 审查</span>
            </div>
          </div>

          <div class="bipartite-stage" id="bipartiteStage">
            <div class="left-column" id="leftColumn"></div>
            <svg class="curves-svg" id="curvesSvg"></svg>
            <div class="right-column" id="rightColumn"></div>
          </div>
        </section>

        <!-- 当前 Issue 的交付产物与 sota 工作区真实源码文件 -->
        <section class="deliverables-card" id="deliverablesCard"></section>
      </div>

      <!-- 3. 右侧伴随式 Session 抽屉：展示你在中间连线图里点中的那一棒 Session 详情，并支持从任意一棒定向重做！ -->
      <aside class="session-peek-drawer">
        <div class="drawer-header">
          <span style="font-size:12px;font-weight:700;color:#1e1b4b;" id="drawerHeaderTitle">⚡ Session 详情</span>
          <button class="pill-btn" style="color:#b45309;border-color:#fcd34d;background:#fffbeb;" onclick="promptRedoSelectedStage()" title="直接唤醒这一棒的原生 Session 重新执行，并自动触发其下游接力">↻ 从这一棒重做</button>
        </div>

        <!-- 切换本 Issue 内的第 1..4 棒 Session -->
        <div class="drawer-turn-tabs" id="drawerTurnTabs"></div>

        <div class="drawer-scroll" id="drawerScroll"></div>

        <div class="sticky-composer">
          <textarea class="composer-textarea" id="composerInput" placeholder="直接向当前选中的智能体 Session 发送插话 (--steer) 或返工要求..."></textarea>
          <div class="composer-footer">

      rightCol.innerHTML = runs.map((r, idx) => {
        const isSelected = idx === selectedRunIdx;
        const isRunning = r.status === "running";
        return `
          <div class="run-pill ${isSelected ? 'selected-pill' : ''}"
               data-run-idx="${idx}"
               data-agent-id="${r.agentId}"

              <div class="run-pill-stage">
                <span>${r.stageLabel || `第 ${idx + 1} 棒 · ${r.agentId}`}</span>

              <div class="run-pill-summary">${r.shortSummary || r.fullReport || ''}</div>

              ${isRunning ? '🟢 运行中' : `✓ ${(r.steps || []).length} 步`}
            </span>
          </div>
        `;
      }).join("");

      requestAnimationFrame(drawIssueCurves);

    // 绘制左列智能体 ➔ 右列本 Issue 各棒 Session 胶囊的贝塞尔连线（因为在单个 Issue 内部，每根线对应一棒，永远清晰不乱！）
    function drawIssueCurves() {
      const stageEl = document.getElementById("bipartiteStage");
      const svgEl = document.getElementById("curvesSvg");
      const leftCol = document.getElementById("leftColumn");
      const rightCol = document.getElementById("rightColumn");
      const stageRect = stageEl.getBoundingClientRect();
      if (stageRect.width === 0) return;

      const actorAnchors = {};
      leftCol.querySelectorAll(".actor-node").forEach(node => {
        const dotEl = node.querySelector(".origin-dot");
        const r = dotEl.getBoundingClientRect();
        actorAnchors[node.dataset.actorId] = {
          x: r.left - stageRect.left + r.width / 2,
          y: r.top - stageRect.top + r.height / 2
        };
      });

      svgEl.setAttribute("viewBox", `0 0 ${stageRect.width} ${stageRect.height}`);
      svgEl.innerHTML = "";

      rightCol.querySelectorAll(".run-pill").forEach(pillEl => {
        const idx = Number(pillEl.dataset.runIdx);
        const agentId = pillEl.dataset.agentId;
        const src = actorAnchors[agentId];
        if (!src) return;
        const r = pillEl.getBoundingClientRect();
        const dst = {
          x: r.left - stageRect.left,
          y: r.top - stageRect.top + r.height / 2
        };

        const span = dst.x - src.x;
        const pathData = `M ${src.x} ${src.y} C ${src.x + span * 0.46} ${src.y}, ${dst.x - span * 0.46} ${dst.y}, ${dst.x} ${dst.y}`;

        const isSelected = idx === selectedRunIdx;
        const color = agentId === "dev-leader" ? "#7c3aed" : (agentId === "pi-coder" ? "#2563eb" : "#10b981");

        if (isSelected) {
          const glow = document.createElementNS("http://www.w3.org/2000/svg", "path");
          glow.setAttribute("d", pathData);
          glow.setAttribute("fill", "none");
          glow.setAttribute("stroke", color);
          glow.setAttribute("stroke-width", "6");
          glow.setAttribute("opacity", "0.18");
          svgEl.appendChild(glow);
        }

        const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        line.setAttribute("d", pathData);
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", isSelected ? "2.4" : "1.5");
        line.setAttribute("opacity", isSelected ? "0.98" : "0.42");
        svgEl.appendChild(line);
      });
    }

          `).join("")
        : `<span class="file-pill" onclick="fetchWorktreeFiles('${t.identifier}')">📂 点击加载 sota 工作区源码文件</span>`;

      const selFile = (activeIdx !== undefined && activeIdx !== null) ? files[activeIdx] : null;
      const codeHtml = selFile
        ? `<div class="code-viewer-box">${selFile.content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`
        : "";

      document.getElementById("deliverablesCard").innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:13px;font-weight:700;color:#111827;">📦 本 Issue 交付产物与 sota 工作区文件 (点击文件名查看源码)</span>
          <span style="font-size:11px;color:#4f46e5;cursor:pointer;font-weight:600;" onclick="fetchWorktreeFiles('${t.identifier}')">↻ 刷新 sota 文件</span>
        </div>
        ${svgHtml}
        <div class="file-pills-row">${pillsHtml}</div>
        ${codeHtml}
      `;
    }

    function toggleFileViewer(taskCode, idx) {
      activeFileByTask[taskCode] = activeFileByTask[taskCode] === idx ? null : idx;
      renderDeliverablesCard();
    }

    // 5. 渲染右侧选中的那一棒 Session 详情抽屉
    function renderSessionDrawer() {
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const runs = t.runs || [];
      const curRun = runs[selectedRunIdx] || runs[runs.length - 1] || { agentId: "pi-coder", stageLabel: "Session", fullReport: "", steps: [] };
      const agentInfo = SQUAD_AGENTS.find(a => a.id === curRun.agentId) || SQUAD_AGENTS[1];

      document.getElementById("drawerHeaderTitle").textContent = `${t.identifier} · ${curRun.stageLabel || agentInfo.name}`;
      document.getElementById("triggerChipLabel").textContent = `⚡ 插话到 ${agentInfo.name} (${t.identifier})`;

      document.getElementById("drawerTurnTabs").innerHTML = runs.map((r, idx) => `
        <span class="turn-tab-pill ${idx === selectedRunIdx ? 'active' : ''}" onclick="selectRunTurn(${idx})">
          第 ${idx + 1} 棒 · ${r.agentId}
        </span>
      `).join("");

      const cleanSteps = (curRun.steps || []).filter(s => !String(s).startsWith("[sota Pi 1.5.0 回复] I'll start by inspecting"));
      const cascadeHint = curRun.agentId === "pi-coder"
        ? "重做此棒将恢复 pi-coder 原会话改代码 → 完成后自动唤醒队长转交 → Reviewer 自动复审结单"
        : curRun.agentId === "codex-reviewer"
        ? "重做此棒仅唤醒 codex-reviewer 重新独立审查，无需 pi-coder 重写代码"
        : "重做此棒将唤醒队长重新拆单并触发下游组员执行";

      document.getElementById("drawerScroll").innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:7px;">
            <div class="actor-avatar" style="background:${agentInfo.color}">${agentInfo.initials}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#111827;">${agentInfo.name} · 绑定会话 (${t.identifier})</div>
              <div style="font-size:10.5px;color:#64748b;">模型：${agentInfo.model} · 隔离目录：worktrees/${t.identifier.toLowerCase()}</div>
            </div>
          </div>
        </div>

        <div style="font-size:11px;color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:7px 10px;">
          <strong>🔗 阶段重做联动规则：</strong>${cascadeHint}
        </div>

        <div class="verdict-box">${curRun.fullReport || curRun.shortSummary || '正在 sota 上执行当前回合...'}</div>

        <div class="steps-box">
          <div class="steps-box-header">
            <span>⚡ 本回合 sota 工具执行步骤 (${cleanSteps.length} 步)</span>
            <span>Pi 1.5.0</span>
          </div>
          <div class="steps-list">
            ${cleanSteps.map(st => `<div>• ${String(st)}</div>`).join("") || '<div>等待步骤输出...</div>'}
          </div>
        </div>
      `;
    }

    // 从当前选中的这一棒直接重做（定向唤醒该角色的原生 Session，并自动串联后续棒次）
    function promptRedoSelectedStage() {
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const runs = t.runs || [];
      const curRun = runs[selectedRunIdx] || runs[runs.length - 1] || { agentId: "pi-coder", stageLabel: "当前阶段" };
      const defaultPrompt = curRun.agentId === "pi-coder"
        ? "在当前代码基础上再补充一个边界测试并重新运行验证"
        : curRun.agentId === "codex-reviewer"
        ? "请重新严格复跑一次测试并给出审查结论"
        : "请重新将此任务委派给 pi-coder 执行";

      const instruction = prompt(
        `【从 ${curRun.stageLabel} (${curRun.agentId}) 重做】\n请输入给 @${curRun.agentId} 的重做/修改指令（将在 sota 上恢复其原生 Session 执行，并自动触发下游接力）：`,
        defaultPrompt
      );
      if (!instruction) return;
      document.getElementById("composerInput").value = instruction;
      document.getElementById("sendCommentBtn").click();
    }

    function openCreateModal() {
      document.getElementById("createModal").classList.add("open");
      document.getElementById("newIssueTitle").focus();
    }
    function closeCreateModal() {
      document.getElementById("createModal").classList.remove("open");
    }

    function submitCreateIssue() {
      const titleEl = document.getElementById("newIssueTitle");
      const descEl = document.getElementById("newIssueDesc");
      const bindEl = document.getElementById("newIssueBind");
      const val = titleEl.value.trim();
      if (!val) { titleEl.focus(); return; }

      const num = 452 + tasksData.length;
      const newCode = "TASK-" + num;
      const boundIssue = bindEl.value.trim() || `nocturn#${num}`;
      const newTask = {
        id: "task_" + Date.now(),
        identifier: newCode,
        boundIssue,
        title: `#${num} ${val}`,
        squadId: "dev",
        status: "dispatching",
        runs: [
          {
            id: "run_init_" + Date.now(),
            agentId: "dev-leader",
            status: "running",
            stageLabel: "① 队长拆单 Session",
            shortSummary: "正在 sota 上唤醒研发队长拆单派发...",
            fullReport: `已创建独立 Issue 沙盒 ${newCode}，正在 sota:/home/qijinyin/multimodal/yangxin/nocturn/worktrees/${newCode.toLowerCase()} 启动研发队长...`,
            steps: [`初始化隔离工作区 worktrees/${newCode.toLowerCase()}`]
          }
        ]
      };
      tasksData.unshift(newTask);
      titleEl.value = "";
      descEl.value = "";
      bindEl.value = "";
      closeCreateModal();
      selectIssue(newTask.id);

      fetch(`${API_BASE}/api/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          identifier: newCode,
          title: `#${num} ${val}`,
          description: `${val} ${descEl.value.trim()}（关联 Issue: ${boundIssue}。请研发队长调用 nocturn dispatch 委派给 pi-coder 实现并验证，完成后立即调用 nocturn report --state ready --risk low 交付）`,
          squadId: "dev"
        })
      }).catch(() => {});
    }

    function cycleTaskStatus(taskId) {
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      t.status = t.status === "in_progress" ? "in_review" : (t.status === "in_review" ? "done" : "in_progress");
      fetch(`${API_BASE}/api/tasks/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, status: t.status })
      }).catch(() => {});
      syncUI();
    }

    function triggerTargetedRework(taskId) {
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      const reason = prompt(`请输入对 ${t.identifier} 的驳回返工意见（将在 sota 上恢复该 Issue 的原会话继续修改）：`, "请再补充一个边界测试并重新汇报");
      if (!reason) return;
      t.status = "in_progress";
      t.runs.push({
        id: "run_rework_" + Date.now(),
        agentId: "pi-coder",
        status: "running",
        stageLabel: `第 ${t.runs.length + 1} 棒 · 定向返工 Session`,
        shortSummary: `收到返工要求：「${reason}」`,
        fullReport: `正在 sota 上恢复 ${t.identifier} 的原 pi-coder 会话执行返工：「${reason}」`,
        steps: [`↩️ 驳回返工：${reason}`]
      });
      selectedRunIdx = t.runs.length - 1;
      fetch(`${API_BASE}/api/rework`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, reviewer: "yangxin", reason })
      }).catch(() => {});
      syncUI();
    }

    function triggerLiveSotaTurn() {
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const curRun = (t.runs || [])[selectedRunIdx] || { agentId: "pi-coder" };
      fetch(`${API_BASE}/api/sota/exec`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          taskId: t.identifier,
          agentId: curRun.agentId,
          prompt: `请用一句话汇报你在任务 ${t.identifier} 工作区下的当前文件与状态。`
        })
      }).catch(() => {});
    }

    function promptBindIssue(taskId) {
      const t = tasksData.find(x => x.id === taskId);
      if (!t) return;
      const val = prompt(`为任务 ${t.identifier} 绑定外部或仓库 Issue：`, t.boundIssue || `nocturn#${t.identifier.replace("TASK-", "")}`);
      if (val === null) return;
      t.boundIssue = val.trim();
      fetch(`${API_BASE}/api/tasks/bind-issue`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, issueRef: t.boundIssue })
      }).catch(() => {});
      syncUI();
    }

    document.getElementById("sendCommentBtn").addEventListener("click", () => {
      const inp = document.getElementById("composerInput");
      const val = inp.value.trim();
      if (!val) return;
      const t = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (!t) return;
      const curRun = (t.runs || [])[selectedRunIdx] || { agentId: "pi-coder", steps: [] };
      curRun.steps.push(`⚡ 你向 ${curRun.agentId} 插话 (delivered): ${val}`);
      inp.value = "";
      syncUI();

      fetch(`${API_BASE}/api/sota/exec`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ taskId: t.identifier, agentId: curRun.agentId, prompt: val })
      }).catch(() => {});
    });

    function syncUI() {
      renderIssueSidebar();
      renderIssueHeader();
      renderIssueBipartiteGraph();
      renderDeliverablesCard();
      renderSessionDrawer();
    }

    // 实时同步后端 SQLite 中的每个 Issue 及其内部的 Runs
    function applyBackendSnapshot(snap) {
      if (!snap || !Array.isArray(snap.tasks) || snap.tasks.length === 0) return;
      const stageNames = ["① 队长拆单 Session", "② pi-coder 编码实现 Session", "③ 队长转交审查 Session", "④ Reviewer 独立审查与结单 Session"];
      tasksData = snap.tasks.map(t => {
        const rawRuns = (snap.runs || []).filter(r => r.taskId === t.id);
        const mappedRuns = rawRuns.map((r, idx) => ({
          id: r.id,
          agentId: r.agentId,
          status: r.status,
          stageLabel: stageNames[idx] || `第 ${idx + 1} 棒 · ${r.agentId} Session`,
          shortSummary: r.verdict?.summary || r.summary,
          fullReport: r.verdict?.summary || r.summary,
          steps: (r.steps || []).map(st => st.text)
        }));
        return {
          id: t.id,
          identifier: t.identifier,
          boundIssue: t.boundIssue || `nocturn#${t.identifier.replace("TASK-", "")}`,
          title: t.title,
          squadId: t.squadId || "dev",
          status: t.status,
          svgUrl: t.identifier === "TASK-451" ? "/api/bicycle-pelican.svg" : (t.identifier === "TASK-445" ? "/api/pelican.svg" : null),
          runs: mappedRuns
        };
      });

      const cur = tasksData.find(x => x.id === selectedTaskId) || tasksData[0];
      if (cur) {
        selectedTaskId = cur.id;
        if (selectedRunIdx >= (cur.runs || []).length) {
          selectedRunIdx = Math.max(0, (cur.runs || []).length - 1);
        }
        if (!cachedWorktreeFiles[cur.identifier]) {
          fetchWorktreeFiles(cur.identifier);
        }
      }
      syncUI();
    }

    try {
      const es = new EventSource(API_BASE + "/api/events");
      es.onmessage = (ev) => {
        try {
          applyBackendSnapshot(JSON.parse(ev.data));
        } catch {}
      };
    } catch {}

    window.addEventListener("resize", () => requestAnimationFrame(drawIssueCurves));
    selectIssue(selectedTaskId);
  </script>
</body>
</html>
