name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --experimental-strip-types --test tests/engine.test.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build standalone binary (linux-x64)
        run: bun build --compile --target=bun-linux-x64 bin/nocturn-standalone.ts --outfile nocturn-linux-x64

      - name: Smoke test (launch binary, fail on GLIBC or CXXABI errors)
        run: |
          ldd nocturn-linux-x64 > ldd.out 2>&1 || true
          if grep -qE "not found" ldd.out; then
            echo "missing shared libraries:"
            cat ldd.out
            exit 1
          fi
          PORT=14120 NOCTURN_DB="$PWD/smoke.sqlite" ./nocturn-linux-x64 > smoke.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:14120/ -o page.html; then
              ok=1
              break
            fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "binary failed to launch:"
            cat smoke.log
            exit 1
          fi
          if grep -qE "GLIBC_|CXXABI_" smoke.log; then
            echo "runtime symbol version errors:"
            cat smoke.log
            exit 1
          fi
          grep -qi nocturn page.html
          if [ $? != "0" ]; then
            echo "UI marker missing"
            exit 1
          fi
          echo "smoke OK: binary launched and served the web UI"

      - uses: actions/upload-artifact@v4
        with:
          name: nocturn-linux-x64
          path: nocturn-linux-x64

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturn-linux-x64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x nocturn-linux-x64
          printf 'Standalone Linux x64 binary (built on ubuntu-22.04, glibc 2.35).\n\n- Run: chmod +x nocturn-linux-x64 && ./nocturn-linux-x64\n- Web UI: http://localhost:4100 (override with PORT)\n- Database: ~/.nocturn/nocturn.sqlite (override with NOCTURN_DB)\n' > release-notes.md
          gh release create "$GITHUB_REF_NAME" nocturn-linux-x64 --repo "$GITHUB_REPOSITORY" --title "nocturn $GITHUB_REF_NAME" --notes-file release-notes.md
