name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --experimental-strip-types --test tests/engine.test.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build standalone binary (linux-x64)
        run: bun build --compile --target=bun-linux-x64 bin/nocturn-standalone.ts --outfile nocturn-linux-x64

      - name: Smoke test
        run: |
          PORT=14120 NOCTURN_DB="$PWD/smoke.sqlite" ./nocturn-linux-x64 > smoke.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:14120/ -o page.html; then ok=1; break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          [ "$ok" = 1 ] || { cat smoke.log; exit 1; }
          grep -qi nocturn page.html || { echo "UI marker missing"; cat smoke.log; exit 1; }
          echo "smoke OK"

      - uses: actions/upload-artifact@v4
        with:
          name: nocturn-linux-x64
          path: nocturn-linux-x64

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nocturn-linux-x64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x nocturn-linux-x64
          gh release create "$GITHUB_REF_NAME" nocturn-linux-x64 \
            --repo "$GITHUB_REPOSITORY" \
            --title "nocturn $GITHUB_REF_NAME" \
            --notes "Standalone Linux x64 binary (built on ubuntu-22.04, glibc 2.35).
- Run: chmod +x nocturn-linux-x64 && ./nocturn-linux-x64
- Web UI: http://localhost:4100 (override with PORT)
- Database: ~/.nocturn/nocturn.sqlite (override with NOCTURN_DB)"
